name: Deploy sites to GitHub Pages

# Publishes lab-site/ at the root and brand-site/ under /brand/ on every push to main.
on:
  push:
    branches: [main]
    paths:
      - "lab-site/**"
      - "brand-site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs of this group.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site (lab at root, brand guideline at /brand/)
        run: |
          mkdir -p _site/brand
          cp -R lab-site/. _site/
          cp -R brand-site/. _site/brand/
          touch _site/.nojekyll

      - name: Upload assembled site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
